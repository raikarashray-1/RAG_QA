name: Render Daytime Keep-Alive

on:
  schedule:
    # Runs every 10 minutes between 3:00 AM UTC (8:30 AM IST) and 13:00 UTC (6:30 PM IST)
    - cron: '*/10 3-13 * * 1-5'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Render app
        run: |
          curl -s -f -m 30 --retry 3 https://rag-qa-x4od.onrender.com/healthz || exit 0
